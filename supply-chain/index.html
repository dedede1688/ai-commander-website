<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jiamei Electronic Technology · Product Showcase</title>
<style>
:root{--bg:#f6f7f9;--ink:#1a1d21;--sub:#6b7280;--line:#e6e8eb;--brand:#0f6b5c;--brand2:#14b8a6;--card:#fff;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
a{color:inherit;text-decoration:none}
.layout{display:flex;min-height:100vh}
.side{width:250px;background:#0d1b19;color:#cfe3df;position:fixed;top:0;bottom:0;left:0;overflow:auto;padding:22px 16px}
.brand{font-weight:800;font-size:18px;color:#fff;letter-spacing:.3px}
.brand small{display:block;font-weight:500;font-size:12px;color:#7fa79f;margin-top:4px}
.langbtn{margin-top:16px;width:100%;background:#16302c;color:#8fd3c7;border:1px solid #24463f;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.langbtn:hover{background:#1d3b36;color:#c7ece2}
.nav{margin-top:8px;display:flex;flex-direction:column}
.nav h4{font-size:11px;text-transform:uppercase;color:#5f817b;letter-spacing:1px;margin:16px 6px 6px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:9px;font-size:14px;color:#cfe3df;transition:.15s}
.nav a:hover{background:#16302c}
.nav a.active{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff}
.nav .cnt{font-size:12px;background:#1c3b36;color:#8fd3c7;padding:1px 8px;border-radius:20px}
.nav a.pending{opacity:.5}
.nav a.backsite{margin-top:auto;flex-direction:row;align-items:center;gap:11px;text-align:left;background:linear-gradient(135deg,#141f60,#0f6b5c 58%,#14b8a6);border:1px solid rgba(140,222,206,.55);border-radius:12px;padding:10px 13px;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:.18s}
.nav a.backsite:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(20,184,166,.45);background:linear-gradient(135deg,#1a2a75,#128a74 58%,#1fd1bb)}
.nav a.backsite .bs-logo{width:36px;height:36px;border-radius:9px;flex:none;background:#0b1440;border:1px solid rgba(140,222,206,.4);object-fit:contain}
.nav a.backsite .bs-text{display:flex;flex-direction:column;gap:2px}
.nav a.backsite .bs-main{color:#fff;font-size:13.5px;font-weight:700;letter-spacing:.5px}
.nav a.backsite .bs-sub{font-size:10px;color:rgba(234,255,249,.65);letter-spacing:1.2px;text-transform:uppercase}
.main{margin-left:250px;flex:1;padding:32px 40px 80px}
.crumb{font-size:14px;color:var(--sub);margin-bottom:18px}
.crumb .clink{color:var(--brand);cursor:pointer;font-weight:600}
.crumb .clink:hover{text-decoration:underline}
.crumb b{color:var(--ink)}
.hero{background:linear-gradient(120deg,#0f6b5c,#14b8a6);color:#fff;border-radius:18px;padding:34px 36px;margin-bottom:28px}
.hero h1{font-size:26px;margin-bottom:6px}
.hero p{opacity:.9;font-size:14px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.catcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;transition:.15s;cursor:pointer}
.catcard:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.07)}
.catcard .k{width:34px;height:34px;border-radius:9px;background:#e7f5f1;color:var(--brand);font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.catcard h3{font-size:16px}
.catcard .en{font-size:12px;color:var(--sub);margin:2px 0 10px}
.catcard .n{font-size:13px;color:var(--brand);font-weight:600}
.catcard.locked{opacity:.62}
.catcard.locked .k{background:#eef0f2;color:#9aa1a9}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.08);border-color:#bfe3db}
.pimg{background:#fff;height:180px;display:flex;align-items:center;justify-content:center;padding:12px}
.pimg img{max-width:100%;max-height:100%;object-fit:contain}
.pimg .ph{color:#c2c8ce;font-size:13px}
.pbody{padding:14px 15px 16px;border-top:1px solid var(--line)}
.sku{font-size:11px;color:var(--brand2);font-weight:700;letter-spacing:.5px}
.pbody h3{font-size:15px;margin:3px 0 1px}
.pbody .alt{font-size:12px;color:#9aa1a9;margin-top:2px}
.tag{display:inline-block;margin-top:9px;font-size:11px;background:#eef7f5;color:var(--brand);padding:2px 9px;border-radius:20px}
.tag.pend{background:#fff4e5;color:#b9701a}
.detail{display:grid;grid-template-columns:420px 1fr;gap:34px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px}
.dimg{background:#fff;border:1px solid var(--line);border-radius:14px;height:400px;display:flex;align-items:center;justify-content:center;padding:20px}
.dimg img{max-width:100%;max-height:100%;object-fit:contain}
.dimg .ph{color:#c2c8ce;font-size:14px}
.dinfo h2{font-size:24px}
.dinfo .dcn{color:#9aa1a9;font-size:14px;margin:2px 0 14px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{font-size:12px;background:#f0f2f4;color:#4b5563;padding:4px 12px;border-radius:20px}
.chip.brand{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff}
.specs{width:100%;border-collapse:collapse;font-size:14px}
.specs td{padding:10px 12px;border-bottom:1px solid var(--line)}
.specs td:first-child{color:var(--sub);width:180px}
.specs tr:nth-child(odd){background:#fafbfc}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--brand);font-size:14px;margin-bottom:16px;cursor:pointer;font-weight:600}
.note{margin-top:16px;font-size:12.5px;color:var(--sub);background:#fafbfc;border:1px dashed var(--line);border-radius:10px;padding:10px 14px}
.subhead{font-size:13px;color:var(--sub);margin:26px 0 12px;font-weight:600;letter-spacing:.3px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.side{display:none}.main{margin-left:0}.detail{grid-template-columns:1fr}.cats{grid-template-columns:1fr 1fr}}
</style></head>

  renderNav('home');
  let h=`<div class="hero"><h1>${t('hero_title')}</h1><p>${t('hero_sub').replace('{n}',total()).replace('{brand}',LANG==='cn'?'家美电子科技':DATA.brand)}</p></div><div class="cats">`;
  DATA.categories.forEach(c=>{
    h+=`<div class="catcard ${c.ready?'':'locked'}" onclick="location.hash='#/cat/${c.key}'">
      <div class="k">${c.key}</div><h3>${c.name[LANG]}</h3><div class="en">${LANG==='cn'?c.name.en:c.name.cn}</div>
      <div class="n">${t('n_units').replace('{n}',c.count)} · ${c.ready?t('ready'):t('pending')}</div></div>`;
  });
  h+='</div>';
  main.innerHTML=h;
}
function catGrid(k){
  renderNav(k); const c=catName(k);
  let h=`<div class="crumb"><span class="clink" onclick="location.hash='#/'">${t('crumb_home')}</span> / <b>${c.key} ${c.name[LANG]}</b></div>`;
  h+=`<div class="hero" style="padding:24px 30px"><h1 style="font-size:22px">${c.key} · ${c.name[LANG]}</h1><p>${t('n_products').replace('{n}',c.count)}</p></div>`;
  const ps=DATA.products.filter(p=>p.cat===k);
  if(!ps.length){h+=`<div class="note">${t('pending')}</div>`;main.innerHTML=h;return;}
  const subs=[...new Set(ps.map(p=>p.sub))];
  subs.forEach(s=>{
    h+=`<div class="subhead">${ps.find(p=>p.sub===s).sub_label[LANG]}</div><div class="grid">`;
    ps.filter(p=>p.sub===s).forEach(p=>{
      const img=p.image?`<img src="${p.image}" alt="">`:`<div class="ph">${t('img_pend')}</div>`;
      const pend=p.status!=='complete'?`<span class="tag pend">${t('param_pend')}</span>`:'';
      const alt=LANG==='cn'?p.name.en:p.name.cn;
      h+=`<div class="pcard" onclick="location.hash='#/p/${p.sku}'"><div class="pimg">${img}</div>
        <div class="pbody"><div class="sku">${p.sku}</div><h3>${p.name[LANG]}</h3>
        <div class="alt">${alt}</div><span class="tag">${p.sub_label[LANG]}</span>${pend}</div></div>`;
    });
    h+='</div>';
  });
  h+=`<div style="text-align:right;margin-top:22px"><span class="back" style="margin-bottom:0" onclick="location.hash='#/'">⌂ ${t('back_home')}</span></div>`;
  main.innerHTML=h;
}
function detail(sku){
  const p=DATA.products.find(x=>x.sku===sku); if(!p){home();return;}
  renderNav(p.cat); const c=catName(p.cat);
  let rows=p.specs.map(r=>`<tr><td>${LANG==='cn'?r[1]:r[0]}</td><td>${LANG==='cn'?r[3]:r[2]}</td></tr>`).join('');
  if(!rows) rows=`<tr><td colspan="2" style="color:#b9701a">${t('param_row')}</td></tr>`;
  const img=p.image?`<img src="${p.image}" alt="">`:`<div class="ph">${t('img_pend')}</div>`;
  const alt=LANG==='cn'?p.name.en:p.name.cn;
  main.innerHTML=`<div class="crumb"><span class="clink" onclick="location.hash='#/'">${t('crumb_home')}</span> / <span class="clink" onclick="location.hash='#/cat/${p.cat}'">${c.key} ${c.name[LANG]}</span> / <b>${p.name[LANG]}</b></div>
     <span class="back" onclick="history.back()">← ${t('back')}</span>
   <div class="detail"><div class="dimg">${img}</div>
   <div class="dinfo"><h2>${p.name[LANG]}</h2><div class="dcn">${alt}</div>
     <div class="meta"><span class="chip brand">${LANG==='cn'?'家美电子科技':DATA.brand}</span>
       <span class="chip">${c.key} ${c.name[LANG]}</span><span class="chip">${p.sub_label[LANG]}</span>
       <span class="chip">${t('sku')} ${p.sku}</span></div>
     <table class="specs">${rows}</table>
   </div></div>
   <div style="text-align:right;margin-top:18px"><span class="back" style="margin-bottom:0" onclick="history.back()">← ${t('back')}</span></div>`;
  // 备注：详情页“数据来源”模块已隐藏（用户 2026-10-27 要求）；p.source 仍保留在 DATA 中，
  // 如需恢复，在上方 </div></div> 前加回：${'<div class="note">'+t('source')+'\uff1a<b>'+p.source+'</b></div>'}
}
function route(){
  paintLang();
  const h=location.hash.replace(/^#/,'');
  if(h.startsWith('/p/')) detail(h.slice(3));
  else if(h.startsWith('/cat/')) catGrid(h.slice(5));
  else home();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route); route();
</script></body></html>
