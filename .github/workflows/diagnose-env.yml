# 诊断 CloudBase 部署环境（只读）· v2
#
# 触发条件：仅 workflow_dispatch（手动触发）
#   - workflow_dispatch 要求文件存在于 default branch（GitHub 官方设计）
#   - 运行此 workflow 前必须先在 GitHub UI 临时禁用 deploy-cloudbase.yml，
#     否则 push 此 workflow 到 main 会触发真实部署
#
# 安全约束：
#   - 不调用任何写操作命令（hosting deploy / delete / create / update）
#   - 所有密钥通过 env 注入，GitHub 已知其来源，自动 mask 任何 echo 输出
#   - CLOUDBASE_ENV_ID 不论来自 vars 还是 secrets，都能在内部传给 tcb 命令
#     （bash 中为真实值，用于 API 调用）；但 echo 时自动 mask，不进 step summary
#   - secrets.* / TCB_SECRET_ID / TCB_SECRET_KEY 真值绝不写入 step summary
#   - 不记录认证 token；不调用交互式 `tcb login`（只用 --apiKeyId/--apiKey 即时鉴权）
#
# 权限：
#   - permissions: contents: read（仅读仓库，避免任何写权限）
#
# 输出位置：所有结论写到 $GITHUB_STEP_SUMMARY（UI 折叠面板），
#           而非 stdout 日志（公开可见）
#
# 实际执行方式：
#   1. UI 临时禁用 deploy workflow
#   2. push 此文件到 main（单文件 commit）
#   3. UI 触发 workflow_dispatch
#   4. 看 Step Summary
#   5. UI 立即重新启用 deploy workflow

name: 诊断 CloudBase 部署环境（只读）

on:
  workflow_dispatch:
    inputs:
      dns_target:
        description: 'DNS 目标域名（默认 www.ai-mmc.cn）'
        required: false
        default: 'www.ai-mmc.cn'

permissions:
  contents: read

jobs:
  diagnose:
    name: 只读探测
    runs-on: ubuntu-latest
    # 双重保险：job 级别也声明只读权限
    permissions:
      contents: read

    steps:
      # ---------------------------------------------------------------
      # 步骤 0：关闭 bash 调试回显（防密钥随 set -x 进入日志）
      # ---------------------------------------------------------------
      - name: 关闭调试回显
        run: set +x

      # ---------------------------------------------------------------
      # 步骤 1：读 CLOUDBASE_ENV_ID，判断来源是 vars 还是 secrets
      #
      # 设计：
      #   - SECRETS_VAL 用 env 块注入，GitHub 已知其值为 secret
      #     → 后续任何 echo / printf / 日志引用都会被自动 mask 成 ***
      #   - 我们**故意不 echo** SECRETS_VAL，只用它判空做布尔
      #   - VARS_VAL 明文，可写入 summary
      # ---------------------------------------------------------------
      - name: 读取 CLOUDBASE_ENV_ID 并判断来源
        id: read-env
        env:
          VARS_VAL: ${{ vars.CLOUDBASE_ENV_ID }}
          SECRETS_VAL: ${{ secrets.CLOUDBASE_ENV_ID }}
        run: |
          {
            echo "## 步骤 1：CLOUDBASE_ENV_ID 来源"
            echo ""
            if [ -n "$SECRETS_VAL" ]; then
              echo "- 来源：**Secrets 区**（密钥区，真值已自动屏蔽）"
              echo "- 是否配置：是"
              echo ""
              echo "> secrets 值无法在 workflow 内读取（GitHub 设计）。"
              echo "> 若需确认真值，请到仓库 Settings → Secrets and variables → Actions → Secrets 查看。"
              echo "source=secrets" >> "$GITHUB_OUTPUT"
            elif [ -n "$VARS_VAL" ]; then
              echo "- 来源：**Variables 区**（变量区，明文）"
              echo "- 真值：\`$VARS_VAL\`"
              echo ""
              echo "source=vars" >> "$GITHUB_OUTPUT"
            else
              echo "- ❌ Secrets 与 Variables 两处都未配置"
              echo ""
              echo "source=none" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      # 步骤 2：DNS CNAME 查询（不调腾讯云 API）
      # ---------------------------------------------------------------
      - name: DNS CNAME 解析查询
        id: dns
        run: |
          TARGET="${{ inputs.dns_target }}"
          CNAME=$(dig +short "$TARGET" CNAME 2>/dev/null || echo "<dig 未安装或解析失败>")
          {
            echo "## 步骤 2：DNS CNAME 解析"
            echo ""
            echo "- 查询域名：\`$TARGET\`"
            echo "- CNAME 记录：\`$CNAME\`"
            echo ""
            echo "**腾讯云静态托管默认 CNAME 模板**：\`www.<env-alias>.cn.tcbaccess.tencentcloudbase.com\`"
            echo ""
            echo "cname=$CNAME" >> "$GITHUB_OUTPUT"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      # 步骤 3：装 CloudBase CLI（只读工具）
      # ---------------------------------------------------------------
      - name: 安装 CloudBase CLI
        run: npm install -g @cloudbase/cli --silent

      # ---------------------------------------------------------------
      # 步骤 3.5：登录 CloudBase（复用 deploy workflow 认证方式）
      #
      # 必要性（v3 修复）：
      #   - tcb 子命令（env list / hosting detail）依赖本地鉴权文件 ~/.cloudbase/auth.json
      #   - deploy workflow 第 72 行已经显式调用 `tcb login --apiKeyId ... --apiKey ...`
      #   - diagnose workflow 之前漏了 login，导致步骤 4/5 报 "No valid identity found"
      #
      # 安全：
      #   - 密钥通过 env 注入（与 deploy workflow 同样的 env 块模式）
      #   - 命令行引用 bash 变量（不直接出现在命令字符串里）
      #   - 关闭 bash 调试回显（步骤 0 已 set +x）
      #   - GitHub 自动 mask 任何 echo 输出
      #
      # 失败处理：
      #   - 退出码非 0 → ::error:: 注释 + exit 1
      #   - 整个 workflow 中止（后续步骤不再依赖 run 状态）
      # ---------------------------------------------------------------
      - name: 登录 CloudBase（非交互式，复用 deploy 认证方式）
        env:
          TCB_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: |
          # 把 tcb login 输出全部丢弃，避免任何潜在敏感信息进 step summary / log
          tcb login --apiKeyId "$TCB_ID" --apiKey "$TCB_KEY" > /dev/null 2>&1
          LOGIN_RC=$?
          {
            echo "## 步骤 3.5：CloudBase 登录"
            echo ""
            echo "- 退出码：$LOGIN_RC"
            if [ "$LOGIN_RC" -ne 0 ]; then
              echo "- 状态：❌ 失败"
              echo ""
              echo "**排查方向**："
              echo "- TCB_SECRET_ID / TCB_SECRET_KEY 是否在 Secrets 区正确配置"
              echo "- 密钥是否对当前腾讯云账号有效（密钥可能在腾讯云控制台被禁用或轮换）"
              echo "- 密钥是否对该环境有访问权限（CAM 策略）"
            else
              echo "- 状态：✅ 成功"
              echo "::notice::tcb login 成功（退出码 0）"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$LOGIN_RC" -ne 0 ]; then
            echo "::error::tcb login 失败（退出码 $LOGIN_RC），诊断中止"
            exit 1
          fi

      # ---------------------------------------------------------------
      # 步骤 4：列出可见 CloudBase 环境（只读）
      #
      # v6 改进（EnvId 真值关联，杜绝间接证据误判）：
      #   - **就地比对 EnvId**：从 tcb env list 取出"匹配 CDN 域名"的环境的 EnvId，
      #     与 ACTIVE_ENV（来自 vars.CLOUDBASE_ENV_ID || secrets.CLOUDBASE_ENV_ID）
      #     做严格等值比对，输出 DIRECT_MATCH=yes/no（**不输出 EnvId 真值**）
      #   - **多重匹配检测**：记录所有 CDN 域名 == DNS CNAME 的环境数，
      #     若 > 1 则 MULTI_MATCH=yes（EnvId 唯一性无法保证 → 不能下"环境匹配"结论）
      #   - **字段缺失检测**：若任一匹配环境缺 StaticStorages → HAS_STATIC_DOMAINS=no
      #   - JSON 解析失败 exit 1（不假装成功）
      #   - EnvId 真值**绝不写入** step summary / step output / stdout——只在 python 内存里用
      # ---------------------------------------------------------------
      - name: 列出可见 CloudBase 环境（只读）
        id: list-env
        env:
          TCB_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_KEY: ${{ secrets.TCB_SECRET_KEY }}
          # v6 用于就地比对 DNS CNAME + EnvId
          DNS_FOR_MATCH: ${{ steps.dns.outputs.cname }}
          ACTIVE_ENV_FOR_MATCH: ${{ vars.CLOUDBASE_ENV_ID || secrets.CLOUDBASE_ENV_ID }}
        run: |
          set -o pipefail

          # 复用步骤 3.5 的鉴权状态（同 Job 共享 ~/.cloudbase/auth.json）

          tcb env list --limit 50 --json > /tmp/list-env.json 2> /tmp/list-env.err
          LIST_RC=$?

          # 情形 1：tcb 命令本身失败
          if [ "$LIST_RC" -ne 0 ]; then
            {
              echo "## 步骤 4：可访问的 CloudBase 环境"
              echo ""
              echo "- tcb env list 退出码：$LIST_RC"
              echo ""
              echo "**状态**：❌ 失败（tcb 命令本身失败）"
              echo ""
              echo "**错误信息前 10 行**（已过滤敏感关键词）："
              echo '```'
              head -10 /tmp/list-env.err | (grep -v -i -E "secret|api[_-]?key|token|password|credential" || true)
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # 情形 2：JSON 解析失败
          cat > /tmp/parse-list-env.py << 'PYEOF'
          import json, os
          dns_cname = os.environ.get('DNS_FOR_MATCH', '')
          active_env = os.environ.get('ACTIVE_ENV_FOR_MATCH', '')
          try:
              with open('/tmp/list-env.json', 'r') as f:
                  data = json.load(f)
              if isinstance(data, list):
                  envs = data
              elif isinstance(data, dict):
                  envs = (data.get('data') or data.get('Data') or
                          data.get('Envs') or data.get('envs') or [])
              else:
                  envs = []

              # v7 修复：检测关键字段缺失——envs 非空但所有元素都没有 EnvId
              has_valid_env = False
              for e in envs:
                  if isinstance(e, dict):
                      if (e.get('EnvId') or e.get('envId')):
                          has_valid_env = True
                          break

              if not envs:
                  # 空响应——合法状态
                  print('STATUS=EMPTY')
                  print('COUNT=0')
                  print('ALIASES=')
                  print('STATIC_DOMAINS=')
                  print('MATCHED_ALIASES=')
                  print('MATCH_COUNT=0')
                  print('DIRECT_MATCH=no')
                  print('MULTI_MATCH=no')
                  print('HAS_STATIC_DOMAINS=no')
              elif not has_valid_env:
                  # v7 修复：envs 非空但无 EnvId——字段缺失 = 脚本错误
                  print('STATUS=INCOMPLETE')
                  print('COUNT=' + str(len(envs)))
                  print('ALIASES=')
                  print('STATIC_DOMAINS=')
                  print('MATCHED_ALIASES=')
                  print('MATCH_COUNT=0')
                  print('DIRECT_MATCH=no')
                  print('MULTI_MATCH=no')
                  print('HAS_STATIC_DOMAINS=no')
              else:
                  # envs 非空且 EnvId 存在——做 CDN 域名比对
                  print('COUNT=' + str(len(envs)))
                  aliases = []
                  static_domains = []
                  matched_aliases = []
                  has_static_domains = False
                  matched_env_ids_for_compare = []
                  for e in envs:
                      alias = e.get('Alias') or e.get('alias') or '?'
                      env_id = e.get('EnvId') or e.get('envId') or ''
                      aliases.append(alias)
                      static_storages = (e.get('StaticStorages') or e.get('staticStorages') or [])
                      if not static_storages:
                          continue
                      has_static_domains = True
                      for ss in static_storages:
                          if isinstance(ss, dict):
                              sd = (ss.get('StaticDomain') or ss.get('staticDomain') or '').strip()
                              if sd:
                                  static_domains.append(sd)
                                  if dns_cname and sd == dns_cname:
                                      matched_aliases.append(alias)
                                      if env_id:
                                          matched_env_ids_for_compare.append(env_id)
                                      break
                  match_count = len(matched_aliases)
                  multi_match = 'yes' if match_count > 1 else 'no'
                  has_static = 'yes' if has_static_domains else 'no'
                  if match_count == 1 and matched_env_ids_for_compare:
                      direct_match = 'yes' if (active_env and matched_env_ids_for_compare[0] == active_env) else 'no'
                  else:
                      direct_match = 'no'
                  # v7 修复：根据 match_count 决定 STATUS
                  # MATCH_COUNT=0 但 HAS_STATIC_DOMAINS=yes → 查询成功但确实没匹配（合法"不匹配"）
                  # MATCH_COUNT=0 且 HAS_STATIC_DOMAINS=no → 字段不全（INCOMPLETE）
                  # MATCH_COUNT>=1 → 至少有一个匹配（OK，可能是部分匹配）
                  if match_count >= 1:
                      print('STATUS=OK')
                  elif has_static_domains:
                      print('STATUS=NO_MATCH')  # 合法不匹配——不是错误
                  else:
                      print('STATUS=UNKNOWN')  # EnvId 有效但 API 域名字段缺失
                  print('ALIASES=' + ','.join(aliases))
                  print('STATIC_DOMAINS=' + '||'.join(static_domains))
                  print('MATCHED_ALIASES=' + ','.join(matched_aliases))
                  print('MATCH_COUNT=' + str(match_count))
                  print('DIRECT_MATCH=' + direct_match)
                  print('MULTI_MATCH=' + multi_match)
                  print('HAS_STATIC_DOMAINS=' + has_static)
          except Exception as ex:
              # v7 修复：明确区分真解析错误——STATUS=PARSE_ERROR
              print('STATUS=PARSE_ERROR')
              print('ERROR=' + type(ex).__name__ + ': ' + str(ex))

          PYEOF

          python3 /tmp/parse-list-env.py > /tmp/parse-list-env.out 2> /tmp/parse-list-env.err
          PARSE_RC=$?

          # v7 修复：bash 检查逻辑——明确区分合法诊断结论 vs 脚本错误
          # 接受：STATUS=OK / STATUS=EMPTY / STATUS=NO_MATCH（合法诊断结论）
          # 拒绝：STATUS=PARSE_ERROR / STATUS=INCOMPLETE（脚本错误或字段缺失）
          if [ "$PARSE_RC" -ne 0 ] || ! grep -qE "^(STATUS=OK|STATUS=EMPTY|STATUS=NO_MATCH|STATUS=UNKNOWN)$" /tmp/parse-list-env.out; then
            {
              echo "## 步骤 4：可访问的 CloudBase 环境"
              echo ""
              echo "- tcb env list 退出码：$LIST_RC（命令成功）"
              echo "- python3 解析退出码：$PARSE_RC"
              echo ""
              echo "**状态**：❌ JSON 解析失败或关键字段缺失"
              echo ""
              echo "**错误详情**："
              echo '```'
              grep "^STATUS=" /tmp/parse-list-env.out 2>/dev/null | head -1
              echo ''
              grep "^ERROR=" /tmp/parse-list-env.err 2>/dev/null || grep "^ERROR=" /tmp/parse-list-env.out 2>/dev/null || echo "（未知错误）"
              echo '```'
              echo ""
              echo "**排查**：检查密钥有效性、API 响应结构是否变化、是否需要更新 tcb CLI 版本"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # 情形 3：解析成功
          COUNT=$(grep "^COUNT=" /tmp/parse-list-env.out | cut -d= -f2)
          ALIASES=$(grep "^ALIASES=" /tmp/parse-list-env.out | cut -d= -f2-)
          STATIC_DOMAINS=$(grep "^STATIC_DOMAINS=" /tmp/parse-list-env.out | cut -d= -f2-)
          MATCHED_ALIASES=$(grep "^MATCHED_ALIASES=" /tmp/parse-list-env.out | cut -d= -f2-)
          MATCH_COUNT=$(grep "^MATCH_COUNT=" /tmp/parse-list-env.out | cut -d= -f2)
          DIRECT_MATCH=$(grep "^DIRECT_MATCH=" /tmp/parse-list-env.out | cut -d= -f2)
          MULTI_MATCH=$(grep "^MULTI_MATCH=" /tmp/parse-list-env.out | cut -d= -f2)
          HAS_STATIC_DOMAINS=$(grep "^HAS_STATIC_DOMAINS=" /tmp/parse-list-env.out | cut -d= -f2)

          # 写入 step output（不含 EnvId 真值）
          echo "env_aliases=$ALIASES" >> "$GITHUB_OUTPUT"
          echo "static_domains=$STATIC_DOMAINS" >> "$GITHUB_OUTPUT"
          echo "matched_aliases=$MATCHED_ALIASES" >> "$GITHUB_OUTPUT"
          echo "match_count=$MATCH_COUNT" >> "$GITHUB_OUTPUT"
          echo "direct_match=$DIRECT_MATCH" >> "$GITHUB_OUTPUT"
          echo "multi_match=$MULTI_MATCH" >> "$GITHUB_OUTPUT"
          echo "has_static_domains=$HAS_STATIC_DOMAINS" >> "$GITHUB_OUTPUT"

          {
            echo "## 步骤 4：可访问的 CloudBase 环境"
            echo ""
            echo "- tcb env list 退出码：$LIST_RC"
            echo "- python3 解析退出码：$PARSE_RC"
            echo "- 共可见 $COUNT 个环境"
            echo ""
            echo "**状态**：✅ 成功"
            echo ""
            echo "**每个环境的静态托管 CDN 域名**（直接证据 C）："
            echo '```'
            if [ -n "$STATIC_DOMAINS" ]; then
              echo "$STATIC_DOMAINS" | tr '||' '\n' | awk '{print "  - " $0}'
            else
              echo "（API 未返回 StaticStorages 字段——HAS_STATIC_DOMAINS=no）"
            fi
            echo '```'
            echo ""
            echo "**就地比对结果**（DNS CNAME vs 各环境 CDN 域名）："
            echo "- 匹配数（MATCH_COUNT）：**$MATCH_COUNT**"
            if [ "$MATCH_COUNT" = "0" ]; then
              echo "- （无环境 CDN 域名等于 DNS CNAME）"
            elif [ "$MATCH_COUNT" = "1" ]; then
              echo "- ✅ 唯一匹配：Alias=\`$MATCHED_ALIASES\` 的环境 CDN 域名等于 DNS CNAME"
              if [ "$DIRECT_MATCH" = "yes" ]; then
                echo "- ✅ **DIRECT_MATCH=yes**：该环境 EnvId == ACTIVE_ENV（CLOUDBASE_ENV_ID）—— 真值关联已确认"
              else
                echo "- ❌ **DIRECT_MATCH=no**：该环境 EnvId ≠ ACTIVE_ENV——密钥配置的目标环境可能不是 DNS 指向的环境"
              fi
            else
              echo "- ⚠️ **MULTI_MATCH=yes**：多个环境 CDN 域名 == DNS CNAME——EnvId 唯一性无法保证"
            fi
            echo ""
            echo "**所有可见环境 Alias 列表**：\`$ALIASES\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      # 步骤 5：查询生效环境静态托管详情（只读）
      #
      # v5 改进（CLI 兼容性 + 解析失败处理）：
      #   - **不重复 login**（步骤 3.5 已鉴权）
      #   - **JSON 解析失败立即 exit 1**（不假装成功）
      #   - 用 --json flag + python3 提取 DefaultDomain / Domains
      #   - 兼容多种字段名（大写驼峰和小写）
      # ---------------------------------------------------------------
      - name: 查询目标环境静态托管详情（只读）
        id: env-detail
        if: steps.read-env.outputs.source != 'none'
        env:
          TCB_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_KEY: ${{ secrets.TCB_SECRET_KEY }}
          # 直接引用 vars || secrets 真值（GitHub 自动 mask echo 输出）
          ACTIVE_ENV: ${{ vars.CLOUDBASE_ENV_ID || secrets.CLOUDBASE_ENV_ID }}
        run: |
          set -o pipefail

          # 复用步骤 3.5 的鉴权状态（不重复 login）

          tcb hosting detail -e "$ACTIVE_ENV" --json > /tmp/detail.json 2> /tmp/detail.err
          DETAIL_RC=$?

          # 情形 1：tcb 命令失败
          if [ "$DETAIL_RC" -ne 0 ]; then
            {
              echo "## 步骤 5：目标环境静态托管配置"
              echo ""
              echo "- tcb hosting detail 退出码：$DETAIL_RC"
              echo ""
              echo "**状态**：❌ 失败（tcb 命令失败）"
              echo ""
              echo "**错误信息前 10 行**（已过滤敏感关键词）："
              echo '```'
              head -10 /tmp/detail.err | (grep -v -i -E "secret|api[_-]?key|token|password|credential" || true)
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # 情形 2：JSON 解析失败
          cat > /tmp/parse-detail.py << 'PYEOF'
          import json
          try:
              with open('/tmp/detail.json', 'r') as f:
                  data = json.load(f)
              if not isinstance(data, dict):
                  print('STATUS=PARSE_ERROR')
                  print('ERROR=响应不是对象（实际类型：' + type(data).__name__ + '）')
              else:
                  # 解包 CLI outputJson 的 {data: ...} 包装层——v7 修复
                  payload = data.get('data') if isinstance(data.get('data'), dict) else data
                  default_domain = (payload.get('cdnDomain') or payload.get('CdnDomain') or
                                    payload.get('DefaultDomain') or payload.get('defaultDomain') or
                                    payload.get('DefaultDomainName') or payload.get('defaultDomainName') or '')
                  domains_raw = payload.get('Domains') or payload.get('domains') or []
                  domain_list = []
                  for d in domains_raw:
                      if isinstance(d, str):
                          domain_list.append(d)
                      elif isinstance(d, dict):
                          name = (d.get('DomainName') or d.get('domainName') or
                                  d.get('Name') or d.get('name') or
                                  d.get('Domain') or d.get('domain') or '')
                          if name:
                              domain_list.append(name)
                  status = payload.get('Status') or payload.get('status') or ''
                  # v7 修复：明确区分 STATUS 类型
                  # - STATUS=OK：响应是 dict 且 DefaultDomain 非空（关键字段存在）
                  # - STATUS=UNKNOWN：响应是 dict 但 cdnDomain/DefaultDomain 等所有兼容域名字段都为空
                  #   → 无法确认默认域名（合法"无默认域名"——无法判定匹配不算不匹配，是错误）
                  # - STATUS=PARSE_ERROR：响应不是 dict（脚本错误或解析失败）
                  # 这里 data 已经是 dict，但 DefaultDomain 可能为空或缺
                  if not default_domain:
                      print('STATUS=UNKNOWN')
                  else:
                      print('STATUS=OK')
                  print('DEFAULT_DOMAIN=' + default_domain)
                  print('DOMAIN_LIST=' + ','.join(domain_list))
                  print('STATUS_FIELD=' + status)
          except Exception as ex:
              print('STATUS=PARSE_ERROR')
              print('ERROR=' + type(ex).__name__ + ': ' + str(ex))

          PYEOF

          python3 /tmp/parse-detail.py > /tmp/parse-detail.out 2> /tmp/parse-detail.err
          PARSE_RC=$?

          # v7 修复：bash 检查逻辑——接受 OK/UNKNOWN，拒绝 PARSE_ERROR
          # - OK：拿到 cdnDomain 等兼容字段，证据完整
          # - UNKNOWN：所有兼容域名字段都为空，无法确认默认域名——合法"信息缺失"，不能误判为不匹配
          if [ "$PARSE_RC" -ne 0 ] || ! grep -qE "^(STATUS=OK|STATUS=UNKNOWN)$" /tmp/parse-detail.out; then
            {
              echo "## 步骤 5：目标环境静态托管配置"
              echo ""
              echo "- tcb hosting detail 退出码：$DETAIL_RC"
              echo "- python3 解析退出码：$PARSE_RC"
              echo ""
              echo "**状态**：❌ JSON 解析失败或响应结构异常"
              echo ""
              echo "**错误详情**："
              echo '```'
              grep "^STATUS=" /tmp/parse-detail.out 2>/dev/null | head -1
              echo ''
              grep "^ERROR=" /tmp/parse-detail.err 2>/dev/null || grep "^ERROR=" /tmp/parse-detail.out 2>/dev/null || echo "（未知错误）"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # 情形 3：解析成功
          DEFAULT_DOMAIN=$(grep "^DEFAULT_DOMAIN=" /tmp/parse-detail.out | cut -d= -f2-)
          DOMAIN_LIST=$(grep "^DOMAIN_LIST=" /tmp/parse-detail.out | cut -d= -f2-)

          # 写入 step output（不含 EnvId 真值）
          echo "default_domain=$DEFAULT_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "domain_list=$DOMAIN_LIST" >> "$GITHUB_OUTPUT"

          {
            echo "## 步骤 5：目标环境静态托管配置"
            echo ""
            echo "- tcb hosting detail 退出码：$DETAIL_RC"
            echo "- python3 解析退出码：$PARSE_RC"
            echo ""
            echo "**状态**：✅ 成功"
            echo ""
            echo "**关键字段**（从 JSON 提取）："
            echo '```'
            echo "默认域名（DefaultDomain）：$DEFAULT_DOMAIN"
            echo "自定义域名清单：$DOMAIN_LIST"
            echo '```'
            echo ""
            echo "**直接证据 A**：上面'默认域名'是 ACTIVE_ENV 的官方 CDN 域名"
            echo "如它等于步骤 2 的 DNS CNAME → ACTIVE_ENV 就是域名解析指向的环境"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      # 步骤 6：汇总证据（始终执行）
      #
      # v6 严格判定（杜绝间接证据误判）：
      #   - **检查步骤 4 / 5 结论**，任一失败时输出 ⚠️ 不给"成功"误导
      #   - 全部成功时只用**直接证据**判定：
      #     - **直接证据 A**：DNS CNAME（公网解析）
      #     - **直接证据 B**：ACTIVE_ENV 的 DefaultDomain（用 CLOUDBASE_ENV_ID 直接查出来）
      #     - **直接证据 C**：DIRECT_MATCH=yes（步骤 4 比对 MATCHED 环境的 EnvId == ACTIVE_ENV，**不输出 EnvId 真值**）
      #   - **"环境匹配"必须 A == B ∧ DIRECT_MATCH=yes**
      #   - **多重匹配**（MULTI_MATCH=yes）→ EnvId 唯一性无法保证 → "未确认"
      #   - **字段缺失**（HAS_STATIC_DOMAINS=no）→ 无法做 EnvId 比对 → "未确认"
      #   - 间接线索（DNS 短名 / Alias 列表 / ai-mmc 字样）只供人工参考，**不作为结论**
      # ---------------------------------------------------------------
      - name: 汇总
        if: always()
        run: |
          LIST_CONCL=${{ steps.list-env.conclusion }}
          DETAIL_CONCL=${{ steps.env-detail.conclusion }}
          DNS_CNAME=${{ steps.dns.outputs.cname }}
          DEFAULT_DOMAIN=${{ steps.env-detail.outputs.default_domain }}
          MATCHED_ALIASES=${{ steps.list-env.outputs.matched_aliases }}
          MATCH_COUNT=${{ steps.list-env.outputs.match_count }}
          DIRECT_MATCH=${{ steps.list-env.outputs.direct_match }}
          MULTI_MATCH=${{ steps.list-env.outputs.multi_match }}
          HAS_STATIC_DOMAINS=${{ steps.list-env.outputs.has_static_domains }}
          ENV_ALIASES=${{ steps.list-env.outputs.env_aliases }}

          # 顶层汇总表
          {
            echo "## 汇总"
            echo ""
            echo "| 项 | 结论 |"
            echo "|---|---|"
            echo "| 步骤 1（env 来源）| ${{ steps.read-env.outputs.source }} |"
            echo "| 步骤 2（DNS CNAME）| \`$DNS_CNAME\` |"
            echo "| 步骤 4（列环境）| $LIST_CONCL |"
            echo "| 步骤 5（托管详情）| $DETAIL_CONCL |"
            echo "| 步骤 4：MATCH_COUNT / MULTI_MATCH / DIRECT_MATCH | $MATCH_COUNT / $MULTI_MATCH / $DIRECT_MATCH |"
            echo "| 步骤 4：HAS_STATIC_DOMAINS | $HAS_STATIC_DOMAINS |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # 关键步骤失败 → 明确告知，不输出"成功"误导
          if [ "$LIST_CONCL" != "success" ] || [ "$DETAIL_CONCL" != "success" ]; then
            {
              echo "---"
              echo ""
              echo "**⚠️ 关键步骤失败，无法给出绑定关系结论。**"
              echo ""
              echo "请查看步骤 4 / 5 的错误信息并排查后重跑。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 全部成功：直接证据判断
          {
            echo "---"
            echo ""
            echo "**直接证据判断（v6 严格判定）**："
            echo ""
            echo "| 证据 | 值 | 含义 |"
            echo "|---|---|---|"
            echo "| **直接证据 A**：DNS CNAME | \`$DNS_CNAME\` | DNS 解析实际指向 |"
            echo "| **直接证据 B**：ACTIVE_ENV 默认域名 | \`$DEFAULT_DOMAIN\` | 密钥配置的目标环境默认 CDN 域名 |"
            echo "| **直接证据 C**：DIRECT_MATCH | \`$DIRECT_MATCH\` | 步骤 4 中：匹配环境的 EnvId == ACTIVE_ENV |"
            echo ""
            echo "**辅助信息**："
            echo ""
            echo "- 匹配环境数（MATCH_COUNT）：$MATCH_COUNT"
            echo "- 多个匹配（MULTI_MATCH）：$MULTI_MATCH"
            echo "- 字段完整性（HAS_STATIC_DOMAINS）：$HAS_STATIC_DOMAINS"
            echo "- 匹配环境的 Alias：\`$MATCHED_ALIASES\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # 判定 A == B
          A_EQ_B="no"
          if [ -n "$DNS_CNAME" ] && [ -n "$DEFAULT_DOMAIN" ] && [ "$DNS_CNAME" = "$DEFAULT_DOMAIN" ]; then
            A_EQ_B="yes"
          fi

          if [ "$A_EQ_B" = "yes" ]; then
            echo "✅ **A == B**：DNS 解析目标与 ACTIVE_ENV 默认域名一致" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$DNS_CNAME" ] && [ -n "$DEFAULT_DOMAIN" ]; then
            echo "❌ **A ≠ B**：DNS 解析目标 ≠ ACTIVE_ENV 默认域名（域名绑定与密钥配置不一致）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "（A 或 B 信息缺失）" >> "$GITHUB_STEP_SUMMARY"
          fi

          # 判定 C（DIRECT_MATCH）解释
          if [ "$DIRECT_MATCH" = "yes" ]; then
            echo "✅ **C=yes**：匹配环境的 EnvId == ACTIVE_ENV——真值关联已确认" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MULTI_MATCH" = "yes" ]; then
            echo "⚠️ **C=no（多重匹配）**：多个环境 CDN 域名 == DNS CNAME——EnvId 唯一性无法保证，不能确认 ACTIVE_ENV 是哪一个" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MATCH_COUNT" = "0" ]; then
            echo "（C=no：无环境 CDN 域名 == DNS CNAME）" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HAS_STATIC_DOMAINS" = "no" ]; then
            echo "⚠️ **C=no（步骤 4 = UNKNOWN）**：API 不返回 StaticStorages 字段——EnvId 直接比对无法进行，需结合步骤 5 结论综合判断" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **C=no**：匹配环境的 EnvId ≠ ACTIVE_ENV——密钥配置的目标环境可能不是 DNS 指向的环境" >> "$GITHUB_STEP_SUMMARY"
          fi

          # 最终结论（v6 严格判定）
          {
            echo ""
            echo "---"
            echo ""
            echo "**最终结论（v6 严格判定）**："
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MULTI_MATCH" = "yes" ]; then
            echo "❓ **未确认（多重匹配）**：多个环境 CDN 域名都等于 DNS CNAME——EnvId 唯一性无法保证" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HAS_STATIC_DOMAINS" = "no" ]; then
            echo "❓ **未确认（字段缺失）**：API 响应缺 StaticStorages——无法做 EnvId 比对" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$A_EQ_B" = "yes" ] && [ "$DIRECT_MATCH" = "yes" ]; then
            echo "✅ **环境匹配**（A == B ∧ C=yes 三项直接证据全部成立）：DNS ↔ ACTIVE_ENV 的默认域名 ↔ 匹配环境的 EnvId 三者一致，EnvId 真值关联已确认" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$A_EQ_B" = "yes" ] && [ "$DIRECT_MATCH" != "yes" ]; then
            echo "❌ **不匹配**（A == B 成立但 C=no）：DNS 和 ACTIVE_ENV 默认域名一致，但匹配环境的 EnvId ≠ ACTIVE_ENV——可能密钥配置的目标环境不是 DNS 指向的环境，或数据不一致" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$A_EQ_B" = "no" ] && [ -n "$DEFAULT_DOMAIN" ] && [ -n "$DNS_CNAME" ]; then
            echo "❌ **不匹配**（A ≠ B）：DNS 解析目标 ≠ ACTIVE_ENV 默认域名——域名绑定与密钥配置不一致" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❓ **未确认**：信息不完整，无法给出明确结论" >> "$GITHUB_STEP_SUMMARY"
          fi

          # 间接线索（明确标注为非证据）
          {
            echo ""
            echo "---"
            echo ""
            echo "**间接线索（仅供人工参考，不作为结论依据）**："
            echo ""
            echo "- DNS 短名：\`$(echo "$DNS_CNAME" | sed -n 's/^www\.\([^.]*\)\..*/\1/p')\`"
            echo "- 可见环境 Alias 列表：\`$ENV_ALIASES\`"
            echo ""
            echo "> ⚠️ 'Alias 含 ai-mmc'或'DNS 短名匹配'**不代表** ACTIVE_ENV 就是该环境。"
            echo "> 只有上方的 A == B ∧ C=yes 全部成立时，才能确认环境匹配。"
          } >> "$GITHUB_STEP_SUMMARY"
