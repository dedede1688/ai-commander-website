name: Deploy to CloudBase Static Hosting

on:
  push:
    branches: [ main ]
  # 手动触发：想立刻验证部署时不必空提交
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 内容与结构检查：任何一项失败都阻断部署
      - name: Run data check
        run: node tools/check-data.js

      - name: Run page and member audits
        run: |
          node tools/audit-home-book.cjs
          node tools/audit-members.cjs
          node tools/check-release.cjs

      # 只打包真正要上线的文件
      - name: Stage site files
        run: |
          mkdir -p _site
          cp *.html *.js *.css _site/
          cp robots.txt sitemap.xml CNAME _site/ 2>/dev/null || true
          cp -r 素材 _site/素材 2>/dev/null || true
          cp -r supply-chain _site/supply-chain
          echo "--- 待部署清单 ---"
          du -sh _site
          find _site -type f | wc -l

      # 包内引用闭环：根目录能取到、打包后漏掉的资源会在这里暴露
      - name: Check deploy bundle
        run: python3 tools/check-deploy-bundle.py _site

      # 发布内容锁定：待上传文件必须与审核过的 manifest 逐文件一致，
      # 防止审核后有人改动页面、替换素材或多带文件上线
      - name: Verify upload matches approved release manifest
        run: node tools/check-release-manifest.cjs _site release-manifest.json

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Remove .git directory
        run: rm -rf .git

      # ===== 部署到目标环境 =====
      # 部署目标编号不在代码里硬编码。以后换环境只需在网页上改一个值，
      # 不用改代码、不用提交。
      #
      # 名称：CLOUDBASE_ENV_ID      值：ai-commander-d9g2lggrtb79054a6
      #
      # 放在「变量」还是「密钥」都可以 —— 下面两行会依次尝试，
      # 先读变量，读不到再读密钥。所以下列两种放法都有效，任选其一：
      #
      #   A. 变量（推荐，明文可见，方便日后核对）
      #      Settings → Secrets and variables → Actions → Variables 区
      #      → New repository variable → Name / Value → Add variable
      #
      #   B. 密钥（同样有效，页面显示为 ••••）
      #      Settings → Secrets and variables → Actions → Secrets 区
      #      → New repository secret → Name / Secret → Add secret
      #
      # 两处都没设时下面会报错中止：宁可不部署，也不要推到错误的桶。
      - name: Deploy to CloudBase Static Hosting
        env:
          TCB_ENV_ID: ${{ vars.CLOUDBASE_ENV_ID || secrets.CLOUDBASE_ENV_ID }}
        run: |
          if [ -z "$TCB_ENV_ID" ]; then
            echo "::error::未找到 CLOUDBASE_ENV_ID，部署已中止。"
            echo "::error::请在 Settings → Secrets and variables → Actions 里"
            echo "::error::新建 CLOUDBASE_ENV_ID（变量或密钥任选其一），值为："
            echo "::error::ai-commander-d9g2lggrtb79054a6"
            exit 1
          fi
          echo "部署目标环境：$TCB_ENV_ID"
          tcb login --apiKeyId ${{ secrets.TCB_SECRET_ID }} --apiKey ${{ secrets.TCB_SECRET_KEY }}
          tcb hosting deploy _site --env-id "$TCB_ENV_ID"