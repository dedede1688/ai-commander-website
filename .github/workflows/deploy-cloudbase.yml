name: Deploy to CloudBase Static Hosting

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 保留你之前写的：数据校验
      - name: Run data check
        run: node tools/check-data.js

      # 保留你之前写的：筛选出纯净的网页文件，避免打包多余文件
      - name: Stage site files
        run: |
          mkdir -p _site
          cp *.html *.js *.css _site/
          cp robots.txt sitemap.xml _site/ 2>/dev/null || true
          cp -r 素材 _site/素材 2>/dev/null || true

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      # 关键一：删除版本控制文件夹，避免云端扫描报错
      - name: Remove .git directory
        run: rm -rf .git

      # 关键二：部署到 ai-commander 环境（账号A）
      # 诊断结论（run 36743980274）：当前密钥无法部署到 ai-mmc-2g4gxl0t5b5731c8，
      # 该环境（www.ai-mmc.cn 实际指向的存储桶）属于第三个腾讯云账号，待定位。
      - name: Deploy to CloudBase Static Hosting
        run: |
          tcb login --apiKeyId ${{ secrets.TCB_SECRET_ID }} --apiKey ${{ secrets.TCB_SECRET_KEY }}
          tcb hosting deploy _site --env-id ai-commander-d9g2lggrtb79054a6