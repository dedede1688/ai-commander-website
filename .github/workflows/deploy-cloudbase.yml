name: Deploy to CloudBase Static Hosting

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 保留你之前写的：数据校验
      - name: Run data check
        run: node tools/check-data.js

      # 保留你之前写的：筛选出纯净的网页文件，避免打包多余文件
      - name: Stage site files
        run: |
          mkdir -p _site
          cp *.html *.js *.css _site/
          cp robots.txt sitemap.xml _site/ 2>/dev/null || true
          cp -r 素材 _site/素材 2>/dev/null || true

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      # 关键一：删除版本控制文件夹，避免云端扫描报错
      - name: Remove .git directory
        run: rm -rf .git

      # 关键二：部署到"域名实际绑定的环境"
      # 注意：www.ai-mmc.cn 绑定在 ai-commander 环境的 HTTP 网关上；
      # 之前 Secret 里的 TCB_ENV_ID 指向另一个环境（ai-mmc），导致部署了但线上看不到新文件。
      # 环境 ID 不是敏感信息（控制台 URL 中可见），此处直接写死，避免再被 Secret 值误导。
      - name: Deploy to CloudBase Static Hosting
        run: |
          tcb login --apiKeyId ${{ secrets.TCB_SECRET_ID }} --apiKey ${{ secrets.TCB_SECRET_KEY }}
          tcb hosting deploy _site --envId ai-commander-d9g2lgrtb79054a6f